services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: book_agent
      POSTGRES_USER: book_agent
      POSTGRES_PASSWORD: book_agent
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U book_agent -d book_agent"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - book_agent_postgres_data:/var/lib/postgresql/data

volumes:
  book_agent_postgres_data:
